# nginx site for AGRAV: TLS termination, static files straight from disk,
# /api and /ws proxied to the Node process on 127.0.0.1:8080.
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/agrav
#   sudo ln -s /etc/nginx/sites-available/agrav /etc/nginx/sites-enabled/agrav
#   sudo certbot --nginx -d games.example.com     (fills in the ssl_* lines)
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name games.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name games.example.com;

    # certbot writes these
    # ssl_certificate     /etc/letsencrypt/live/games.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/games.example.com/privkey.pem;

    root /opt/agrav;
    index index.html;
    gzip on;
    gzip_types text/javascript application/javascript text/css application/json application/manifest+json;

    # never serve the server or its dependencies
    location ~ ^/(server|deploy|node_modules)/ { return 404; }
    location ~ /\. { return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store";
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;      # idle lobbies must not be cut off
        proxy_buffering off;
    }

    location /shared/vendor/ { add_header Cache-Control "public, max-age=86400"; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
}
